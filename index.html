<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Camino a Berlín</title>
<style>
  :root{
    --bg:#0E1A20; --panel:#16262E; --panel2:#1C3039; --line:#243B45;
    --text:#E4ECEE; --dim:#8CA6AF; --faint:#5C7680;
    --done:#63B79C; --today:#F0A63C; --race:#F2695C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .num{font-family:ui-monospace,'SF Mono','Roboto Mono',Menlo,monospace;font-variant-numeric:tabular-nums}

  .races{display:flex;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .race{flex:1;padding:12px 10px;border-right:1px solid var(--line)}
  .race:last-child{border-right:none;background:#1A2B33}
  .race .nm{font-size:10.5px;color:var(--dim);margin-bottom:3px}
  .race:last-child .nm{color:var(--race)}
  .race .d{font-size:18px;font-weight:600;color:var(--dim);line-height:1}
  .race:last-child .d{font-size:22px;color:var(--text)}
  .race .d span{font-size:10px;font-weight:400;color:var(--faint);margin-left:3px}
  .race .g{font-size:10px;color:var(--faint);margin-top:3px}

  .hero{padding:22px 18px 20px;border-bottom:1px solid var(--line)}
  .hero .when{font-size:11px;color:var(--today);margin-bottom:10px}
  .hero .main{display:flex;align-items:flex-start;gap:16px}
  .hero .km{font-size:46px;font-weight:300;line-height:.9}
  .hero .km span{font-size:15px;color:var(--dim);margin-left:2px}
  .hero .txt{font-size:15px;line-height:1.35}
  .hero .typ{font-size:11px;margin-top:5px}

  .strip{display:flex;gap:4px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;width:30px;height:30px;border-radius:15px;border:none;background:transparent;
        color:var(--faint);font-size:12px;font-family:ui-monospace,monospace;cursor:pointer}
  .chip.now{color:var(--today);font-weight:600}
  .chip.sel{background:var(--text);color:var(--bg);font-weight:600}

  .whead{padding:16px 18px 4px;display:flex;justify-content:space-between;align-items:baseline}
  .whead h2{font-size:17px;font-weight:600;margin:0}
  .whead .blk{font-size:12px;color:var(--dim);margin-top:2px}
  .whead .tot{font-size:13px;color:var(--dim);text-align:right}

  .list{padding:10px 12px}
  .rest{padding:11px 8px;font-size:12.5px;color:var(--faint);display:flex;gap:10px}
  .rest b{width:62px;font-weight:400}

  .card{border:1px solid var(--line);background:var(--panel);border-radius:6px;margin-bottom:7px;overflow:hidden}
  .card.done{background:#14282A}
  .card.today{border-color:var(--today)}
  .row{display:flex;align-items:center;gap:11px;padding:11px 12px;cursor:pointer}
  .tick{width:24px;height:24px;flex-shrink:0;border-radius:12px;border:1.5px solid var(--line);
        background:transparent;color:var(--bg);font-size:13px;font-weight:700;line-height:1;padding:0;cursor:pointer}
  .card.done .tick{border-color:var(--done);background:var(--done)}
  .row .mid{flex:1;min-width:0}
  .row .day{font-size:10.5px;color:var(--faint);margin-bottom:3px}
  .card.today .row .day{color:var(--today)}
  .row .sess{font-size:13.5px;line-height:1.3}
  .card.done .row .sess{color:var(--dim)}
  .row .right{text-align:right;flex-shrink:0}
  .row .rkm{font-size:15px;color:var(--dim)}
  .card.done .row .rkm{color:var(--done)}
  .row .bar{width:22px;height:2px;margin:6px 0 0 auto;opacity:.8}

  .panel{padding:0 12px 13px;border-top:1px solid var(--line)}
  .fields{display:flex;gap:8px;margin-top:12px}
  .lbl{display:block;font-size:10px;color:var(--faint);margin-bottom:4px}
  .inp{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:5px;padding:8px 9px;font-size:13.5px;font-family:inherit}
  .inp:focus{outline:2px solid var(--done);outline-offset:1px;border-color:transparent}
  textarea.inp{resize:vertical;line-height:1.4;margin-top:0}
  select.inp{padding:8px 4px}

  .prog{margin:18px 18px 0;padding-top:16px;border-top:1px solid var(--line)}
  .prow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:8px}
  .bar-bg{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar-fill{height:100%;background:var(--done);width:0}

  .btn{padding:11px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;
       background:transparent;color:var(--dim);border:1px solid var(--line);width:100%}
  .btn:active{opacity:.7}
  .btn.solid{background:var(--panel2);color:var(--text);margin-top:16px}

  .tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;color:var(--dim)}
  .tbl th{font-weight:500;font-size:10.5px;color:var(--faint);padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
  .tbl th:first-child,.tbl td:first-child{text-align:left;color:var(--text)}
  .tbl td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--panel)}
  .tbl td:last-child{color:var(--text)}

  .tools{margin:20px 18px 0;display:flex;gap:8px}
  .status{text-align:center;font-size:11px;color:var(--faint);margin-top:16px;height:14px}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="races" id="races"></div>
<div id="hero"></div>
<div class="strip" id="strip"></div>
<div class="whead" id="whead"></div>
<div class="list" id="list"></div>
<div class="prog">
  <div class="prow"><span>Temporada</span><span class="num" id="pSess"></span></div>
  <div class="bar-bg"><div class="bar-fill" id="pBar"></div></div>
  <div class="prow" style="margin:10px 0 0"><span>Kilómetros acumulados</span><span class="num" id="pKm"></span></div>
</div>
<div style="margin:20px 18px 0"><button class="btn" id="btnPaces">Ver tabla de ritmos</button><div id="paces"></div></div>
<div class="tools">
  <button class="btn" id="btnExport">Exportar copia</button>
  <button class="btn" id="btnImport">Importar copia</button>
</div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<div class="status" id="status"></div>

<script>
/* ── datos del plan ── */
const BASE = new Date(2026,8,14);
const DAYS=[{k:'mar',l:'martes',o:1},{k:'mie',l:'miércoles',o:2},{k:'jue',l:'jueves',o:3},{k:'sab',l:'sábado',o:5},{k:'dom',l:'domingo',o:6}];
const TC={q:'#F0A63C',e:'#5C7680',m:'#7FA8C4',l:'#9B8BD0',r:'#F2695C'};
const TN={q:'Calidad',e:'Fácil',m:'Medio',l:'Larga',r:'Carrera'};

const PLAN=[
 ['Reconstrucción',{mar:['8 km fácil + 6 rectas',8,'e'],mie:['8 km fácil',8,'e'],jue:null,sab:['8 km + 8x30" en cuesta',8,'q'],dom:['14 km fácil',14,'l']}],
 ['Reconstrucción',{mar:['9 km + 8x30" en cuesta',9,'q'],mie:['8 km fácil',8,'e'],jue:['8 km fácil',8,'e'],sab:['6 km suave',6,'e'],dom:['15 km fácil',15,'l']}],
 ['Reconstrucción',{mar:["Fartlek 8x1'/1' por sensaciones",10,'q'],mie:['9 km fácil',9,'e'],jue:['8 km fácil',8,'e'],sab:['7 km suave',7,'e'],dom:['16 km fácil',16,'l']}],
 ['Reconstrucción · descarga',{mar:['8 km fácil + 6 rectas',8,'e'],mie:['8 km fácil',8,'e'],jue:['7 km fácil',7,'e'],sab:null,dom:['14 km fácil',14,'l']}],

 ['Base y umbral',{mar:["4x2000 umbral · rec 2'",11,'q'],mie:['10 km fácil',10,'e'],jue:['9 km medio',9,'m'],sab:['8 km fácil',8,'e'],dom:['17 km fácil',17,'l']}],
 ['Base y umbral',{mar:["3x3000 umbral · rec 3'",14,'q'],mie:['10 km fácil',10,'e'],jue:['10 km medio',10,'m'],sab:['8 km fácil',8,'e'],dom:['18 km · últimos 4 a ritmo de media',18,'l']}],
 ['Base y umbral',{mar:['5x2000 umbral · rec 90"',16,'q'],mie:['11 km fácil',11,'e'],jue:['10 km medio',10,'m'],sab:['9 km fácil',9,'e'],dom:['19 km · últimos 5 a ritmo de media',19,'l']}],
 ['Base y umbral · descarga',{mar:["8 km + 6x1' fuerte",8,'q'],mie:['9 km fácil',9,'e'],jue:['8 km fácil',8,'e'],sab:['7 km suave',7,'e'],dom:['16 km fácil',16,'l']}],
 ['Base y umbral',{mar:["Tempo continuo 25'",13,'q'],mie:['11 km fácil',11,'e'],jue:['11 km medio',11,'m'],sab:['10 km fácil',10,'e'],dom:['20 km · últimos 6 a ritmo de media',20,'l']}],
 ['Base y umbral',{mar:["2x5000 umbral · rec 4'",16,'q'],mie:['12 km fácil',12,'e'],jue:['12 km medio',12,'m'],sab:['10K de control (Benidorm)',16,'r'],dom:['12 km suave',12,'e']}],
 ['Base y umbral',{mar:['6x1500 umbral · rec 90"',16,'q'],mie:['13 km fácil',13,'e'],jue:['12 km medio',12,'m'],sab:['11 km fácil',11,'e'],dom:['20 km · 2x5 km a ritmo de media',20,'l']}],
 ['Base y umbral · descarga',{mar:["Tempo continuo 30'",13,'q'],mie:['10 km fácil',10,'e'],jue:['9 km fácil',9,'e'],sab:['7 km suave',7,'e'],dom:['16 km fácil',16,'l']}],

 ['Afilado de 10K',{mar:['5x1000 VO2 · rec 2\'30"',14,'q'],mie:['12 km fácil',12,'e'],jue:['12 km medio',12,'m'],sab:['12 km + 6 rectas',12,'e'],dom:['20 km · últimos 6 a ritmo de media',20,'l']}],
 ['Afilado de 10K',{mar:['4x1500 a ritmo de 10K · rec 2\'30"',14,'q'],mie:['13 km fácil',13,'e'],jue:['12 km medio',12,'m'],sab:["8 km + tempo 15'",12,'q'],dom:['21 km · 2x6 km a ritmo de media',21,'l']}],
 ['Afilado de 10K',{mar:["6x1000 VO2 · rec 2'",14,'q'],mie:['11 km fácil',11,'e'],jue:['10 km medio',10,'m'],sab:['13 km fácil',13,'e'],dom:['20 km · últimos 8 a ritmo de media',20,'l']}],
 ['Afilado de 10K',{mar:["3x2000 a ritmo de 10K · rec 3'",13,'q'],mie:['10 km fácil',10,'e'],jue:['9 km fácil',9,'e'],sab:['San Silvestre 5K',12,'r'],dom:['16 km fácil',16,'l']}],

 ['Enero · taper Valencia',{mar:["6x800 a ritmo de 10K · rec 2'",11,'q'],mie:['9 km fácil',9,'e'],jue:['8 km fácil',8,'e'],sab:['6 km + 4 rectas',6,'e'],dom:['10K VALENCIA',14,'r']}],
 ['Enero · recuperación',{mar:['8 km muy suave',8,'e'],mie:['10 km fácil',10,'e'],jue:["10 km + 6x1'",10,'q'],sab:['9 km fácil',9,'e'],dom:['15 km fácil',15,'l']}],
 ['Enero · mini-taper',{mar:["3x2000 a ritmo de media · rec 2'",10,'q'],mie:['7 km fácil',7,'e'],jue:['6 km fácil',6,'e'],sab:['5 km + 4 rectas',5,'e'],dom:['MEDIA DE SANTA POLA',24,'r']}],

 ['Transición',{mar:['7 km suave',7,'e'],mie:['8 km fácil',8,'e'],jue:null,sab:['7 km fácil',7,'e'],dom:['13 km fácil',13,'l']}],
 ['Base 2',{mar:["8 km + 8x1'",8,'q'],mie:['10 km fácil',10,'e'],jue:['9 km fácil',9,'e'],sab:['8 km fácil',8,'e'],dom:['15 km fácil',15,'l']}],
 ['Base 2',{mar:["4x2500 umbral · rec 2'",12,'q'],mie:['11 km fácil',11,'e'],jue:['10 km medio',10,'m'],sab:['9 km fácil',9,'e'],dom:['20 km · últimos 6 a ritmo de media',20,'l']}],
 ['Base 2',{mar:["3x4000 umbral · rec 3'",14,'q'],mie:['12 km fácil',12,'e'],jue:['12 km medio',12,'m'],sab:['10 km fácil',10,'e'],dom:['22 km · 2x6 km a ritmo de media',22,'l']}],
 ['Base 2',{mar:["Tempo continuo 35'",15,'q'],mie:['13 km fácil',13,'e'],jue:['12 km medio',12,'m'],sab:['11 km + 6 rectas',11,'e'],dom:['24 km · últimos 10 a ritmo de media',24,'l']}],
 ['Base 2 · descarga',{mar:["5x1000 VO2 · rec 2'",11,'q'],mie:['11 km fácil',11,'e'],jue:['10 km fácil',10,'e'],sab:['8 km suave',8,'e'],dom:['18 km fácil',18,'l']}],
 ['Específico Berlín',{mar:["2x6000 umbral · rec 4'",18,'q'],mie:['13 km fácil',13,'e'],jue:['13 km medio',13,'m'],sab:["11 km + tempo 15'",11,'q'],dom:['25 km · 2x7 km a ritmo de media',25,'l']}],
 ['Específico Berlín',{mar:["3x5000 umbral · rec 3'",21,'q'],mie:['14 km fácil',14,'e'],jue:['13 km medio',13,'m'],sab:['11 km fácil',11,'e'],dom:['26 km · últimos 14 a 3:53 — la sesión clave',26,'l']}],

 ['Taper Berlín',{mar:["4x2000 a ritmo de media · rec 2'",12,'q'],mie:['11 km fácil',11,'e'],jue:['10 km fácil',10,'e'],sab:['9 km + 6 rectas',9,'e'],dom:['18 km · últimos 6 a ritmo de media',18,'l']}],
 ['Taper Berlín',{mar:["6x1000 a ritmo de media · rec 2'",10,'q'],mie:['8 km fácil',8,'e'],jue:['6 km + 4 rectas',6,'e'],sab:['4 km muy suave',4,'e'],dom:['MEDIA DE BERLÍN',24,'r']}]
];

const RACES=[
 {n:'10K Valencia',d:new Date(2027,0,10),g:'37:30–37:50'},
 {n:'Media Santa Pola',d:new Date(2027,0,24),g:'1:23:00–1:23:30'},
 {n:'Media de Berlín',d:new Date(2027,3,4),g:'1:22:00–1:23:00'}
];
const PACES=[
 ['Rodaje fácil','5:05–5:20','5:00–5:15','4:55–5:10'],
 ['Rodaje medio','4:35–4:45','4:30–4:40','4:25–4:35'],
 ['Ritmo de media','4:00–4:03','3:55–3:57','3:53'],
 ['Umbral','3:55–4:00','3:48–3:52','3:44–3:47'],
 ['Ritmo de 10K','3:50','3:44–3:47','3:42–3:45'],
 ['VO2max','3:40–3:45','3:36–3:40','3:34–3:38']
];

/* ── estado ── */
const KEY='plan2027-log';
let log={}, wi=0, open=null, showPaces=false;
try{ log=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ log={}; }

const today=new Date();
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const sDate=(w,o)=>addD(BASE,w*7+o);
const dk=d=>d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
const fmt=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wkTot=w=>DAYS.reduce((s,d)=>s+(PLAN[w][1][d.k]?PLAN[w][1][d.k][1]:0),0);
const TOTAL_KM=PLAN.reduce((s,_,i)=>s+wkTot(i),0);
const TOTAL_S=PLAN.reduce((s,w)=>s+DAYS.filter(d=>w[1][d.k]).length,0);

const curWeek=Math.min(Math.max(Math.floor(Math.floor((today-BASE)/864e5)/7),0),PLAN.length-1);
wi=curWeek;

let saveT;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{ localStorage.setItem(KEY,JSON.stringify(log)); flash('Guardado'); }
    catch(e){ flash('No se pudo guardar','#F2695C'); }
  },300);
}
function flash(msg,color){
  const el=document.getElementById('status');
  el.textContent=msg; el.style.color=color||'var(--faint)';
  clearTimeout(el._t); el._t=setTimeout(()=>{el.textContent='';},1500);
}

/* ── render ── */
function renderRaces(){
  document.getElementById('races').innerHTML=RACES.map(r=>{
    const days=Math.ceil((r.d-today)/864e5);
    return `<div class="race"><div class="nm">${esc(r.n)}</div>
      <div class="d num">${days>0?days:'—'}<span>días</span></div>
      <div class="g num">${esc(r.g)}</div></div>`;
  }).join('');
}

function nextSession(){
  for(let w=0;w<PLAN.length;w++) for(const d of DAYS){
    const s=PLAN[w][1][d.k]; if(!s) continue;
    const id='w'+w+'-'+d.k, dt=sDate(w,d.o);
    if(!(log[id]&&log[id].done) && dt>=addD(today,-1)) return {w,d,s,id,dt};
  }
  return null;
}

function renderHero(){
  const n=nextSession(); const el=document.getElementById('hero');
  if(!n){ el.innerHTML=`<div class="hero"><div class="when">Temporada completada</div>
    <div class="txt">Berlín queda atrás. Toca descansar.</div></div>`; return; }
  el.innerHTML=`<div class="hero">
    <div class="when">Siguiente · ${n.d.l} ${fmt(n.dt)}</div>
    <div class="main">
      <div class="km num">${n.s[1]}<span>km</span></div>
      <div style="flex:1;padding-top:3px">
        <div class="txt">${esc(n.s[0])}</div>
        <div class="typ" style="color:${TC[n.s[2]]}">${TN[n.s[2]]}</div>
      </div>
    </div>
    <button class="btn solid" id="goNext">Anotar esta sesión</button></div>`;
  document.getElementById('goNext').onclick=()=>{wi=n.w;open=n.id;renderAll();
    document.getElementById('list').scrollIntoView({behavior:'smooth',block:'start'});};
}

function renderStrip(){
  const el=document.getElementById('strip');
  el.innerHTML=PLAN.map((_,i)=>`<button class="chip ${i===wi?'sel':''} ${i===curWeek?'now':''}" data-w="${i}">${i+1}</button>`).join('');
  const sel=el.querySelector('.sel'); if(sel) sel.scrollIntoView({inline:'center',block:'nearest'});
}

function renderWeek(){
  const wkDone=DAYS.reduce((s,d)=>{
    const e=log['w'+wi+'-'+d.k];
    return s+(e&&e.done?(parseFloat(e.km)||PLAN[wi][1][d.k][1]):0);
  },0);
  document.getElementById('whead').innerHTML=`<div><h2>Semana ${wi+1}</h2>
    <div class="blk">${esc(PLAN[wi][0])}</div></div>
    <div class="tot num"><span style="color:${wkDone>0?'var(--done)':'var(--faint)'}">${wkDone.toFixed(0)}</span> / ${wkTot(wi)} km</div>`;

  document.getElementById('list').innerHTML=DAYS.map(d=>{
    const s=PLAN[wi][1][d.k], id='w'+wi+'-'+d.k;
    if(!s) return `<div class="rest"><b>${d.l}</b><span>Descanso</span></div>`;
    const e=log[id]||{}, dt=sDate(wi,d.o), isT=dk(dt)===dk(today), isO=open===id;
    return `<div class="card ${e.done?'done':''} ${isT?'today':''}" data-id="${id}">
      <div class="row" data-toggle="${id}">
        <button class="tick" data-tick="${id}" aria-label="Marcar hecha">${e.done?'✓':''}</button>
        <div class="mid">
          <div class="day">${d.l} ${fmt(dt)}${isT?' · hoy':''}</div>
          <div class="sess">${esc(s[0])}</div>
        </div>
        <div class="right">
          <div class="rkm num" data-km="${id}">${e.done&&e.km?esc(e.km):s[1]}</div>
          <div class="bar" style="background:${TC[s[2]]}"></div>
        </div>
      </div>
      ${isO?`<div class="panel">
        <div class="fields">
          <label style="flex:1"><span class="lbl">Km reales</span>
            <input class="inp num" inputmode="decimal" placeholder="${s[1]}" data-f="km" data-id="${id}" value="${esc(e.km||'')}"></label>
          <label style="flex:1"><span class="lbl">Ritmo medio</span>
            <input class="inp num" placeholder="4:52" data-f="pace" data-id="${id}" value="${esc(e.pace||'')}"></label>
          <label style="width:80px"><span class="lbl">Pulso</span>
            <input class="inp num" inputmode="numeric" placeholder="148" data-f="hr" data-id="${id}" value="${esc(e.hr||'')}"></label>
        </div>
        <label style="display:block;margin-top:10px"><span class="lbl">Sensación</span>
          <select class="inp" data-f="feel" data-id="${id}">
            ${['','1','2','3','4','5'].map(v=>`<option value="${v}" ${e.feel===v?'selected':''}>${({'':'—','1':'Muy mal','2':'Justo','3':'Normal','4':'Bien','5':'Volando'})[v]}</option>`).join('')}
          </select></label>
        <label style="display:block;margin-top:10px"><span class="lbl">Notas</span>
          <textarea class="inp" rows="2" placeholder="Viento, molestias, cómo fueron las series…" data-f="notes" data-id="${id}">${esc(e.notes||'')}</textarea></label>
      </div>`:''}
    </div>`;
  }).join('');
}

function renderProgress(){
  let n=0,km=0;
  Object.values(log).forEach(e=>{ if(e&&e.done){n++;km+=parseFloat(e.km)||0;} });
  document.getElementById('pSess').textContent=n+' / '+TOTAL_S+' sesiones';
  document.getElementById('pBar').style.width=Math.min(100,n/TOTAL_S*100)+'%';
  document.getElementById('pKm').innerHTML=`<span style="color:var(--text)">${km.toFixed(0)}</span> / ${TOTAL_KM}`;
}

function renderPaces(){
  document.getElementById('btnPaces').textContent=showPaces?'Ocultar ritmos':'Ver tabla de ritmos';
  document.getElementById('paces').innerHTML=showPaces?`<table class="tbl">
    <thead><tr><th>Sesión</th><th>Sep–Oct</th><th>Enero</th><th>Abril</th></tr></thead>
    <tbody>${PACES.map(p=>`<tr><td>${esc(p[0])}</td><td class="num">${esc(p[1])}</td><td class="num">${esc(p[2])}</td><td class="num">${esc(p[3])}</td></tr>`).join('')}</tbody></table>`:'';
}

function renderAll(){ renderHero(); renderStrip(); renderWeek(); renderProgress(); }

/* ── eventos ── */
document.getElementById('strip').addEventListener('click',e=>{
  const b=e.target.closest('[data-w]'); if(!b) return;
  wi=+b.dataset.w; open=null; renderAll();
});

document.getElementById('list').addEventListener('click',e=>{
  const t=e.target.closest('[data-tick]');
  if(t){ e.stopPropagation();
    const id=t.dataset.tick, cur=log[id]||{};
    const def=PLAN[wi][1][id.split('-')[1]][1];
    log[id]={...cur,done:!cur.done,km:cur.km||String(def)};
    save(); renderAll(); return; }
  const r=e.target.closest('[data-toggle]');
  if(r){ const id=r.dataset.toggle; open=(open===id?null:id); renderWeek(); }
});

document.getElementById('list').addEventListener('input',e=>{
  const f=e.target.dataset.f; if(!f) return;
  const id=e.target.dataset.id;
  log[id]={...(log[id]||{}),[f]:e.target.value};
  if(f==='km'){
    const cell=document.querySelector(`[data-km="${id}"]`);
    if(cell&&log[id].done) cell.textContent=e.target.value||'';
  }
  save(); renderProgress();
});
document.getElementById('list').addEventListener('change',e=>{
  if(e.target.dataset.f==='feel'){
    log[e.target.dataset.id]={...(log[e.target.dataset.id]||{}),feel:e.target.value}; save();
  }
});

document.getElementById('btnPaces').onclick=()=>{showPaces=!showPaces;renderPaces();};

document.getElementById('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(log,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='entrenos-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href); flash('Copia descargada');
};
document.getElementById('btnImport').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ log={...log,...JSON.parse(r.result)}; save(); renderAll(); flash('Copia importada'); }
    catch(e){ flash('Archivo no válido','#F2695C'); } };
  r.readAsText(f); ev.target.value='';
};

renderRaces(); renderAll(); renderPaces();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
