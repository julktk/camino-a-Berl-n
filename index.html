<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Camino a Berlín</title>
<style>
  :root{
    --bg:#0E1A20; --panel:#16262E; --panel2:#1C3039; --line:#243B45;
    --text:#E4ECEE; --dim:#8CA6AF; --faint:#5C7680;
    --done:#63B79C; --today:#F0A63C; --race:#F2695C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .num{font-family:ui-monospace,'SF Mono','Roboto Mono',Menlo,monospace;font-variant-numeric:tabular-nums}

  .races{display:flex;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .race{flex:1;padding:12px 10px;border-right:1px solid var(--line)}
  .race:last-child{border-right:none;background:#1A2B33}
  .race .nm{font-size:10.5px;color:var(--dim);margin-bottom:3px}
  .race:last-child .nm{color:var(--race)}
  .race .d{font-size:18px;font-weight:600;color:var(--dim);line-height:1}
  .race:last-child .d{font-size:22px;color:var(--text)}
  .race .d span{font-size:10px;font-weight:400;color:var(--faint);margin-left:3px}
  .race .g{font-size:10px;color:var(--faint);margin-top:3px}

  .hero{padding:22px 18px 20px;border-bottom:1px solid var(--line)}
  .hero .when{font-size:11px;color:var(--today);margin-bottom:10px}
  .hero .main{display:flex;align-items:flex-start;gap:16px}
  .hero .km{font-size:46px;font-weight:300;line-height:.9}
  .hero .km span{font-size:15px;color:var(--dim);margin-left:2px}
  .hero .txt{font-size:15px;line-height:1.35}
  .hero .typ{font-size:11px;margin-top:5px}

  .strip{display:flex;gap:4px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;width:30px;height:30px;border-radius:15px;border:none;background:transparent;
        color:var(--faint);font-size:12px;font-family:ui-monospace,monospace;cursor:pointer}
  .chip.now{color:var(--today);font-weight:600}
  .chip.sel{background:var(--text);color:var(--bg);font-weight:600}

  .whead{padding:16px 18px 4px;display:flex;justify-content:space-between;align-items:baseline}
  .whead h2{font-size:17px;font-weight:600;margin:0}
  .whead .blk{font-size:12px;color:var(--dim);margin-top:2px}
  .whead .tot{font-size:13px;color:var(--dim);text-align:right}

  .list{padding:10px 12px}
  .rest{padding:11px 8px;font-size:12.5px;color:var(--faint);display:flex;gap:10px}
  .rest b{width:62px;font-weight:400}

  .card{border:1px solid var(--line);background:var(--panel);border-radius:6px;margin-bottom:7px;overflow:hidden}
  .card.done{background:#14282A}
  .card.today{border-color:var(--today)}
  .row{display:flex;align-items:center;gap:11px;padding:11px 12px;cursor:pointer}
  .tick{width:24px;height:24px;flex-shrink:0;border-radius:12px;border:1.5px solid var(--line);
        background:transparent;color:var(--bg);font-size:13px;font-weight:700;line-height:1;padding:0;cursor:pointer}
  .card.done .tick{border-color:var(--done);background:var(--done)}
  .row .mid{flex:1;min-width:0}
  .row .day{font-size:10.5px;color:var(--faint);margin-bottom:3px}
  .card.today .row .day{color:var(--today)}
  .row .sess{font-size:13.5px;line-height:1.3}
  .card.done .row .sess{color:var(--dim)}
  .row .right{text-align:right;flex-shrink:0;display:flex;align-items:center;gap:9px}
  .row .rkm{font-size:15px;color:var(--dim)}
  .card.done .row .rkm{color:var(--done)}
  .row .bar{width:3px;height:22px;border-radius:2px;opacity:.85}
  .caret{color:var(--faint);font-size:10px;transition:transform .15s}
  .card.open .caret{transform:rotate(180deg)}

  .panel{border-top:1px solid var(--line)}
  .card.fz{margin:-3px 0 7px 22px;background:#131F27;border-style:dashed}
  .card.fz.done{background:#14282A;border-style:solid}
  .card.fz .row{padding:9px 12px}
  .card.fz .sess{font-size:12.5px}
  .card.fz .tick{width:21px;height:21px;font-size:11px}
  .fsub{font-size:10.5px;color:var(--faint);margin-top:3px}
  .fwarn{margin-top:10px;font-size:11px;color:var(--today);line-height:1.4}

  /* descripción */
  .desc{padding:13px 13px 14px;background:#12212A;border-bottom:1px solid var(--line)}
  .desc .seg{display:flex;gap:10px;margin-bottom:9px}
  .desc .seg:last-of-type{margin-bottom:0}
  .desc .tag{flex:0 0 76px;font-size:10px;color:var(--faint);padding-top:2px;text-transform:uppercase;letter-spacing:.4px}
  .desc .val{flex:1;font-size:12.5px;line-height:1.45;color:var(--dim)}
  .desc .val b{color:var(--text);font-weight:600}
  .desc .focus{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
               font-size:12.5px;line-height:1.5;color:var(--dim);font-style:italic}

  /* registro */
  .rec{padding:13px}
  .rec h4{margin:0 0 10px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;font-weight:500}
  .fields{display:flex;gap:8px}
  .lbl{display:block;font-size:10px;color:var(--faint);margin-bottom:4px}
  .inp{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
       border-radius:5px;padding:8px 9px;font-size:13.5px;font-family:inherit}
  .inp:focus{outline:2px solid var(--done);outline-offset:1px;border-color:transparent}
  textarea.inp{resize:vertical;line-height:1.4}
  select.inp{padding:8px 4px}

  .reps{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .rep{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .rep .n{flex:0 0 58px;font-size:11px;color:var(--faint)}
  .rep input{flex:0 0 78px;text-align:center;padding:7px 4px}
  .rep .p{flex:1;font-size:12px;color:var(--done);text-align:right}
  .rep .p.slow{color:var(--today)}
  .repavg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);
          margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}

  .prog{margin:18px 18px 0;padding-top:16px;border-top:1px solid var(--line)}
  .prow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:8px}
  .bar-bg{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar-fill{height:100%;background:var(--done);width:0}

  .btn{padding:11px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;
       background:transparent;color:var(--dim);border:1px solid var(--line);width:100%}
  .btn:active{opacity:.7}
  .btn.solid{background:var(--panel2);color:var(--text);margin-top:16px}

  .tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;color:var(--dim)}
  .tbl th{font-weight:500;font-size:10.5px;color:var(--faint);padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
  .tbl th:first-child,.tbl td:first-child{text-align:left;color:var(--text)}
  .tbl td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--panel)}
  .tbl td:last-child{color:var(--text)}

  .tools{margin:20px 18px 0;display:flex;gap:8px}
  .status{text-align:center;font-size:11px;color:var(--faint);margin-top:16px;height:14px}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="races" id="races"></div>
<div id="hero"></div>
<div class="strip" id="strip"></div>
<div class="whead" id="whead"></div>
<div class="list" id="list"></div>
<div class="prog">
  <div class="prow"><span>Temporada</span><span class="num" id="pSess"></span></div>
  <div class="bar-bg"><div class="bar-fill" id="pBar"></div></div>
  <div class="prow" style="margin:10px 0 0"><span>Kilómetros acumulados</span><span class="num" id="pKm"></span></div>
  <div class="prow" style="margin:6px 0 0"><span>Sesiones de fuerza</span><span class="num" id="pFz"></span></div>
</div>
<div style="margin:20px 18px 0"><button class="btn" id="btnPaces">Ver tabla de ritmos</button><div id="paces"></div></div>
<div class="tools">
  <button class="btn" id="btnExport">Exportar copia</button>
  <button class="btn" id="btnImport">Importar copia</button>
</div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<div class="status" id="status"></div>

function autoDesc(s,w){
  const p=phase(w);
  if(s[2]==='e') return {wu:null,sets:[],focus:'Conversación fluida de principio a fin, a '+PACE.facil[p]+'/km. Si no puedes hablar en frases completas, vas rápido. Este es el error nº1 cuando sube el volumen.'};
  if(s[2]==='m') return {wu:null,sets:[],focus:'A '+PACE.medio[p]+'/km. Cómodo pero con intención: ni rodaje ni sesión de calidad. Sirve para acumular volumen de calidad sin coste de recuperación.'};
  if(s[2]==='l') return {wu:null,sets:[],focus:'Toda a ritmo fácil, '+PACE.facil[p]+'/km. El objetivo es tiempo de pie, no velocidad. Lleva agua si pasa de 90 minutos.'};
  return {wu:null,sets:[],focus:''};
}

/* tiempo → segundos · acepta 7:44 · 1:23:45 · 744 */
function parseT(v){
  if(!v) return null;
  v=String(v).trim();
  if(/^\d{1,2}:\d{2}:\d{2}$/.test(v)){const[h,m,s]=v.split(':').map(Number);return h*3600+m*60+s;}
  if(/^\d{1,3}:\d{2}$/.test(v)){const[m,s]=v.split(':').map(Number);return m*60+s;}
  if(/^\d{3,4}$/.test(v)){const s=+v.slice(-2),m=+v.slice(0,-2);return m*60+s;}
  return null;
}
const fmtP=sec=>{const m=Math.floor(sec/60),s=Math.round(sec%60);return m+':'+String(s).padStart(2,'0');};

function nextSession(){

  return null;
}

function descBlock(s,dayK){
  const key=wi+'-'+dayK, p=phase(wi);
  const d=D[key]||autoDesc(s,wi);
  let h='<div class="desc">';
  if(d.wu) h+=`<div class="seg"><div class="tag">Calentar</div><div class="val">${esc(d.wu)}</div></div>`;
  if(d.sets&&d.sets.length){
    const body=d.sets.map(st=>{
      const lab=st.label||`${st.n}x${st.d>=1000?(st.d/1000)+' km':st.d+' m'}`;
      const cnt=st.n>1&&!st.label?'':(st.n>1?`${st.n}x `:'');
      const pc=st.pace?` a <b>${PACE[st.pace][p]}/km</b>`:'';
      const rc=st.rec?` · recuperación ${esc(st.rec)}`:'';
      return `${cnt}${esc(lab)}${pc}${rc}`;
    }).join('<br>');
    h+=`<div class="seg"><div class="tag">Sesión</div><div class="val">${body}</div></div>`;
  }
  if(d.cd) h+=`<div class="seg"><div class="tag">Soltar</div><div class="val">${esc(d.cd)}</div></div>`;
  if(s[2]==='q'||s[2]==='r') h+=`<div class="seg"><div class="tag">Movilidad</div><div class="val">${esc(MOB)}</div></div>`;
  if(s[2]==='q'||s[2]==='r'||s[2]==='l') h+=`<div class="seg"><div class="tag">Después</div><div class="val">${esc(STRETCH)}</div></div>`;
  if(d.focus) h+=`<div class="focus">${esc(d.focus)}</div>`;
  return h+'</div>';
}

function repsBlock(s,dayK,id,e){
  const key=wi+'-'+dayK, p=phase(wi);
  const d=D[key]; if(!d||!d.sets||!d.sets.length) return '';
  const flat=[];
  d.sets.forEach(st=>{
    for(let i=0;i<st.n;i++) flat.push({d:st.d,pace:st.pace,
      label:st.label&&st.n===1?st.label:(st.label?st.label+' '+(i+1):(st.d>=1000?(st.d/1000)+' km':st.d+' m'))});
  });
  if(flat.length===1&&!flat[0].d) return '';
  const vals=e.reps||[];
  const rows=flat.map((f,i)=>{
    const t=parseT(vals[i]);
    let pace='',cls='';
    if(t&&f.d){ const sp=t/(f.d/1000); pace=fmtP(sp)+'/km';
      if(f.pace&&PACE_MID[f.pace]&&sp>PACE_MID[f.pace][p]+8) cls='slow'; }
    else if(t) pace=fmtP(t);
    return `<div class="rep"><div class="n">${esc(f.label)}</div>
      <input class="inp num" inputmode="numeric" placeholder="--:--" data-rep="${i}" data-id="${id}" value="${esc(vals[i]||'')}">
      <div class="p ${cls}" data-repp="${i}">${pace}</div></div>`;
  }).join('');
  const times=flat.map((f,i)=>({t:parseT(vals[i]),d:f.d})).filter(x=>x.t&&x.d);
  let avg='';
  if(times.length>1){
    const sp=times.reduce((a,x)=>a+x.t/(x.d/1000),0)/times.length;
    const first=times[0].t/(times[0].d/1000), last=times[times.length-1].t/(times[times.length-1].d/1000);
    const drift=Math.round(last-first);
    avg=`<div class="repavg"><span>Media <span class="num" style="color:var(--text)">${fmtP(sp)}/km</span></span>
      <span>Deriva <span class="num" style="color:${drift>6?'var(--today)':'var(--done)'}">${drift>0?'+':''}${drift} s/km</span></span></div>`;
  }
  return `<div class="reps"><h4>Parciales</h4>${rows}
    <label style="display:block;margin-top:10px"><span class="lbl">Recuperación real entre series</span>
      <input class="inp" placeholder="p. ej. 2' trote · 400 m" data-f="rec" data-id="${id}" value="${esc(e.rec||'')}"></label>
    ${avg}</div>`;
}

          <div class="day">${d.l} ${fmt(dt)}${isT?' · hoy':''}</div>
          <div class="sess">${esc(s[0])}</div>
        </div>
        <div class="right">
          <div><div class="rkm num" data-km="${id}">${e.done&&e.km?esc(e.km):s[1]}</div></div>
          <div class="bar" style="background:${TC[s[2]]}"></div>
          <div class="caret">▼</div>
        </div>
      </div>
      ${isO?`<div class="panel">
        ${descBlock(s,d.k)}
        <div class="rec"><h4>Cómo fue</h4>
        <div class="fields">
          <label style="flex:1"><span class="lbl">Km reales</span>
            <input class="inp num" inputmode="decimal" placeholder="${s[1]}" data-f="km" data-id="${id}" value="${esc(e.km||'')}"></label>
          <label style="flex:1"><span class="lbl">Ritmo medio</span>
            <input class="inp num" placeholder="4:52" data-f="pace" data-id="${id}" value="${esc(e.pace||'')}"></label>
          <label style="width:76px"><span class="lbl">Pulso</span>
            <input class="inp num" inputmode="numeric" placeholder="148" data-f="hr" data-id="${id}" value="${esc(e.hr||'')}"></label>
        </div>
        ${repsBlock(s,d.k,id,e)}
        <label style="display:block;margin-top:12px"><span class="lbl">Sensación</span>
          <select class="inp" data-f="feel" data-id="${id}">
            ${['','1','2','3','4','5'].map(v=>`<option value="${v}" ${e.feel===v?'selected':''}>${({'':'—','1':'Muy mal','2':'Justo','3':'Normal','4':'Bien','5':'Volando'})[v]}</option>`).join('')}
          </select></label>
        <label style="display:block;margin-top:10px"><span class="lbl">Notas</span>
          <textarea class="inp" rows="2" placeholder="Viento, molestias, cómo fueron las series…" data-f="notes" data-id="${id}">${esc(e.notes||'')}</textarea></label>
        </div>
      </div>`:''}
    </div>`+fuerzaCard(d.k);
  }).join('');
}

function fuerzaCard(dayK){
  if(!fDias(wi).includes(dayK)) return '';
  const F=FUERZA[fFase(wi)], id='w'+wi+'-'+dayK+'-f', e=log[id]||{}, isO=open===id;
  return `<div class="card fz ${e.done?'done':''} ${isO?'open':''}" data-id="${id}">
    <div class="row" data-toggle="${id}">
      <button class="tick" data-tick="${id}" aria-label="Marcar fuerza hecha">${e.done?'✓':''}</button>
      <div class="mid">
        <div class="day">fuerza · después de correr</div>
        <div class="sess">${esc(F.t)}</div>
        <div class="fsub">${esc(F.s)}</div>
      </div>
      <div class="right"><div class="bar" style="background:#B07FC4"></div><div class="caret">▼</div></div>
    </div>
    ${isO?`<div class="panel">
      <div class="desc">
        <div class="seg"><div class="tag">Ejercicios</div><div class="val">${F.ej.map(x=>esc(x)).join('<br>')}</div></div>
        <div class="seg"><div class="tag">Series</div><div class="val"><b>${esc(F.s)}</b> · 25-30 min en total</div></div>
        <div class="focus">${esc(F.n)}</div>
      </div>
      <div class="rec"><h4>Cargas y notas</h4>
        <textarea class="inp" rows="3" placeholder="Sentadilla 4x6 @60 kg · búlgara 3x8 @16 kg · gemelo 3x8 @20 kg…" data-f="notes" data-id="${id}">${esc(e.notes||'')}</textarea>
        <div class="fwarn">${esc(NO_PESAS)}</div>
      </div>
    </div>`:''}
  </div>`;
}

function renderProgress(){
  let n=0,km=0,f=0;
  Object.entries(log).forEach(([k,e])=>{ if(!e||!e.done) return;
    if(k.endsWith('-f')){ f++; return; }
    n++; km+=parseFloat(e.km)||0; });
  document.getElementById('pSess').textContent=n+' / '+TOTAL_S+' sesiones';
  document.getElementById('pFz').innerHTML='<span style="color:var(--text)">'+f+'</span> / '+TOTAL_F;
  document.getElementById('pBar').style.width=Math.min(100,n/TOTAL_S*100)+'%';
  document.getElementById('pKm').innerHTML=`<span style="color:var(--text)">${km.toFixed(0)}</span> / ${TOTAL_KM}`;
}

function renderPaces(){
  document.getElementById('btnPaces').textContent=showPaces?'Ocultar ritmos':'Ver tabla de ritmos';
  document.getElementById('paces').innerHTML=showPaces?`<table class="tbl">
    <thead><tr><th>Sesión</th><th>Sep–Oct</th><th>Enero</th><th>Abril</th></tr></thead>
    <tbody>${PACES.map(p=>`<tr><td>${esc(p[0])}</td>${[0,1,2].map(i=>`<td class="num">${esc(PACE[p[1]][i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'';
}

function renderAll(){ renderHero(); renderStrip(); renderWeek(); renderProgress(); }

/* ══════════ EVENTOS ══════════ */
document.getElementById('strip').addEventListener('click',e=>{
  const b=e.target.closest('[data-w]'); if(!b) return;
  wi=+b.dataset.w; open=null; renderAll();
});

document.getElementById('list').addEventListener('click',e=>{
  const t=e.target.closest('[data-tick]');
  if(t){ e.stopPropagation();
    const id=t.dataset.tick, cur=log[id]||{};
    if(id.endsWith('-f')){ log[id]={...cur,done:!cur.done}; }
    else { const def=PLAN[wi][1][id.split('-')[1]][1];
      log[id]={...cur,done:!cur.done,km:cur.km||String(def)}; }
    save(); renderAll(); return; }
  if(e.target.closest('.panel')) return;
  const r=e.target.closest('[data-toggle]');
  if(r){ const id=r.dataset.toggle; open=(open===id?null:id); renderWeek();
    if(open){const c=document.querySelector('[data-id="'+id+'"]');
      if(c) setTimeout(()=>c.scrollIntoView({behavior:'smooth',block:'nearest'}),40);} }
});

document.getElementById('list').addEventListener('input',e=>{
  const id=e.target.dataset.id; if(!id) return;
  if(e.target.dataset.rep!==undefined){
    const i=+e.target.dataset.rep;
    const reps=(log[id]&&log[id].reps)?[...log[id].reps]:[];
    reps[i]=e.target.value;
    log[id]={...(log[id]||{}),reps};
    // recalcular solo el ritmo de esa serie, sin re-render
    const card=e.target.closest('.card');
    const day=id.split('-')[1], d=D[wi+'-'+day];
    if(d){ const flat=[]; d.sets.forEach(st=>{for(let k=0;k<st.n;k++)flat.push(st);});
      const st=flat[i], t=parseT(e.target.value), out=card.querySelector('[data-repp="'+i+'"]');
      if(out){ if(t&&st.d){ const sp=t/(st.d/1000); out.textContent=fmtP(sp)+'/km';
          out.className='p'+(st.pace&&PACE_MID[st.pace]&&sp>PACE_MID[st.pace][phase(wi)]+8?' slow':''); }
        else if(t){ out.textContent=fmtP(t); out.className='p'; }
        else { out.textContent=''; } } }
    save(); return;
  }
  const f=e.target.dataset.f; if(!f) return;
  log[id]={...(log[id]||{}),[f]:e.target.value};
  if(f==='km'){
    const cell=document.querySelector(`[data-km="${id}"]`);
    if(cell&&log[id].done) cell.textContent=e.target.value||'';
  }
  save(); renderProgress();
});
document.getElementById('list').addEventListener('change',e=>{
  if(e.target.dataset.f==='feel'){
    log[e.target.dataset.id]={...(log[e.target.dataset.id]||{}),feel:e.target.value}; save();
  }
});

document.getElementById('btnPaces').onclick=()=>{showPaces=!showPaces;renderPaces();};

document.getElementById('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(log,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='entrenos-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href); flash('Copia descargada');
};
document.getElementById('btnImport').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ log={...log,...JSON.parse(r.result)}; save(); renderAll(); flash('Copia importada'); }
    catch(e){ flash('Archivo no válido','#F2695C'); } };
  r.readAsText(f); ev.target.value='';
};

renderRaces(); renderAll(); renderPaces();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
